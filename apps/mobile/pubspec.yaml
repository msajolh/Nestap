name: nestap
description: Nestap smart home app.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^3.5.0
  # Navigation
  go_router: ^18.1.3
  # Networking
  dio: ^5.11.1
  web_socket_channel: ^3.0.3
  # Storage
  flutter_secure_storage: ^11.2.0
  shared_preferences: ^2.5.6
  # UI (Material moved out of the Flutter SDK in 3.47)
  material_ui: ^1.10.0
  google_fonts: ^9.0.0
  # Domain helpers
  equatable: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
